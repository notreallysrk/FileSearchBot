services:
  mongodb:
    image: mongo:7.0
    container_name: filebot_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filebot_app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DATABASE_NAME=telegram_file_bot
      - WEB_SERVER_HOST=0.0.0.0
      - WEB_SERVER_PORT=8080
      - WEBHOOK_ENABLED=false
    ports:
      - "8080:8080"
    networks:
      - bot_network

volumes:
  mongo_data:
    driver: local

networks:
  bot_network:
    driver: bridge
